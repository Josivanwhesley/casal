<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6d4aff">
<meta name="referrer" content="no-referrer">
<title>Nosso Casal</title>
<style>
:root{--bg:#f5f3fb;--card:#fff;--tx:#1f1b2e;--mu:#7b7590;--pr:#6d4aff;--prt:#fff;--ok:#16a34a;--bad:#e11d48;--wa:#d97706;--bd:#eceaf4;--sh:0 1px 2px rgba(30,20,70,.04),0 10px 28px rgba(30,20,70,.07);--prs:color-mix(in srgb,var(--pr) 12%,var(--card))}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13101c;--card:#1d1928;--tx:#f3f0fb;--mu:#a49dbb;--bd:#2b2639;--sh:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13101c;--card:#1d1928;--tx:#f3f0fb;--mu:#a49dbb;--bd:#2b2639;--sh:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 120px}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 18px 10px;max-width:640px;margin:auto}
header h1{font-size:20px;margin:0;letter-spacing:-.3px}header small{color:var(--mu)}
.hr{display:flex;gap:8px;align-items:center}
.pill{border:0;background:var(--prs);color:var(--pr);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;font-weight:600}
.ib{border:0;background:var(--card);box-shadow:var(--sh);border-radius:50%;width:34px;height:34px;font-size:15px}
main{padding:0 16px;max-width:640px;margin:auto}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--mu);margin:24px 4px 10px}
.hero{background:linear-gradient(135deg,var(--pr),color-mix(in srgb,var(--pr) 55%,#ec4899));color:#fff;border-radius:26px;padding:22px;box-shadow:0 14px 30px color-mix(in srgb,var(--pr) 35%,transparent);margin-bottom:12px}
.hero .big{font-size:34px;font-weight:800;letter-spacing:-1px;margin:4px 0}.hero .k2{opacity:.8;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--sh)}
.card.c:active{transform:scale(.98)}
.ic{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--prs);font-size:18px;margin-bottom:8px}
.k{color:var(--mu);font-size:12.5px}.v{font-size:21px;font-weight:700;letter-spacing:-.4px;margin:1px 0}
.bar{height:7px;background:var(--bd);border-radius:9px;margin:8px 0 6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr);border-radius:9px;transition:width .3s}
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.row .g{flex:1;min-width:0}.row small{color:var(--mu);display:block;font-size:12px}
input,select{width:100%;padding:12px 13px;border:1.5px solid var(--bd);border-radius:14px;background:var(--bg);color:var(--tx);font:inherit;outline:0}
input:focus,select:focus{border-color:var(--pr)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--pr);flex:none}
input[type=color]{padding:2px;height:40px}
.f{display:grid;gap:10px;grid-template-columns:1fr 1fr}.f .w{grid-column:1/-1}
.b{border:0;background:var(--pr);color:var(--prt);border-radius:11px;padding:8px 14px;font:inherit;font-size:14px;font-weight:600;text-decoration:none;display:inline-block;text-align:center}
.b.s{background:var(--prs);color:var(--pr)}.b.full{width:100%}
.q{border:0;background:var(--prs);color:var(--pr);width:26px;height:26px;border-radius:50%;font-size:15px;line-height:1;font-weight:700;padding:0;flex:none}
.x{border:0;background:none;color:var(--bad);font-size:17px;padding:3px 4px}.x.e{color:var(--pr);font-size:14px}
.tag{font-size:11px;padding:3px 9px;border-radius:99px;background:var(--prs);color:var(--pr);font-weight:600;white-space:nowrap}
.tag.late{background:color-mix(in srgb,var(--bad) 14%,var(--card));color:var(--bad)}.tag.soon{background:color-mix(in srgb,var(--wa) 16%,var(--card));color:var(--wa)}.tag.ok{background:color-mix(in srgb,var(--ok) 14%,var(--card));color:var(--ok)}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs .b{flex:1;padding:8px 6px;font-size:13px}
.seg{display:flex;gap:2px;background:var(--prs);padding:3px;border-radius:13px;margin-bottom:12px}.seg .b{flex:1;padding:7px 4px;font-size:13px;border-radius:10px;background:transparent;color:var(--mu)}.seg .b:not(.s){background:var(--card);color:var(--pr);box-shadow:0 1px 3px rgba(30,20,70,.14)}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:616px;margin:auto;display:flex;background:var(--card);box-shadow:0 10px 36px rgba(30,20,70,.18);border-radius:22px;padding:4px}
nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:10.5px;padding:5px 2px;border-radius:18px}nav button span{display:block;font-size:17px}nav .on{background:var(--prs);color:var(--pr);font-weight:700}
.tot{font-size:14px;color:var(--mu);text-align:right;margin:12px 4px}
.empty{color:var(--mu);text-align:center;padding:16px;font-size:14px}
.done{text-decoration:line-through;color:var(--mu)}
.gt{min-height:100vh;display:grid;place-items:center;padding:24px}.gt .card{width:100%;max-width:400px;text-align:center}.gt .f{text-align:left}
.logo{font-size:44px}.err{color:var(--bad);font-size:13px;min-height:18px}
.sh{position:fixed;inset:0;background:rgba(10,5,30,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sh .card{width:100%;max-width:640px;border-radius:26px 26px 0 0;max-height:85vh;overflow:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 12px}.sw i{width:34px;height:34px;border-radius:50%;display:block;border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--bd)}.sw i.on{box-shadow:0 0 0 2.5px var(--tx)}
.code{font:700 22px ui-monospace,Menlo,monospace;letter-spacing:2px;background:var(--prs);color:var(--pr);padding:12px;border-radius:14px;text-align:center;margin:8px 0;user-select:all}
</style>
</head>
<body>
<div id="gate"></div>
<div id="app" style="display:none">
<header><div><h1 id="ttl">Nosso Casal</h1><small id="sub"></small></div><div class="hr"><button class="pill" id="who" onclick="openSet()"></button><button class="ib" onclick="openSet()" aria-label="Ajustes">⚙️</button></div></header>
<main id="m"></main>
<nav id="nav"></nav>
</div>
<div id="sheet"></div>
<script type="module">
/* ====== COLE AQUI A CONFIGURAÇÃO DO SEU PROJETO FIREBASE (veja o LEIA-ME.md) ====== */
const firebaseConfig = {

  apiKey: "AIzaSyA4WgPNSU5U0yYrq3ObK9S-i8-MDnk94VI",

  authDomain: "nosso-casal.firebaseapp.com",

  projectId: "nosso-casal",

  storageBucket: "nosso-casal.firebasestorage.app",

  messagingSenderId: "576634102491",

  appId: "1:576634102491:web:d1816e254ee21c96fde2fe"

};

;
/* ================================================================================== */
const V='10.14.1',B='https://www.gstatic.com/firebasejs/'+V+'/';
const $=id=>document.getElementById(id);
const CFG=firebaseConfig.apiKey!=='COLE_AQUI';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lget=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lset=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let T={pr:'#6d4aff',mode:'auto'};try{T=Object.assign(T,JSON.parse(lget('casal_theme'))||{})}catch(e){}
function applyTheme(){const r=document.documentElement;r.style.setProperty('--pr',T.pr);T.mode==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',T.mode)}
applyTheme();
if(!CFG){$('gate').innerHTML='<div class="gt"><div class="card"><div class="logo">🔧</div><h1>Falta configurar o Firebase</h1><p class="k">Abra o index.html, cole a configuração do seu projeto Firebase no começo do script e siga o passo a passo do LEIA-ME.md.</p></div></div>'}
else{
const [{initializeApp},A,F]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
const {doc,collection,setDoc,getDoc,updateDoc,onSnapshot,serverTimestamp,increment,writeBatch,query,orderBy,limit,getDocs,where}=F;
const app=initializeApp(firebaseConfig),auth=A.getAuth(app);
const db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})});

const eur=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'EUR'}).format(n||0);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const val=id=>$(id).value.trim();
const num=id=>parseFloat(String(val(id)).replace(',','.'))||0;
const mk=()=>new Date().toISOString().slice(0,7);
const today=()=>new Date().toISOString().slice(0,10);
const fd=d=>d?d.split('-').reverse().join('/'):'';
const days=d=>Math.round((new Date(d+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5);
const dt=o=>o&&o.at&&o.at.toDate?o.at.toDate():new Date();
const dstr=o=>dt(o).toISOString().slice(0,10);
const tstr=o=>{const d=dt(o);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
function week(){const d=new Date(today()+'T00:00:00'),w=(d.getDay()+6)%7,a=new Date(d);a.setDate(d.getDate()-w);const b=new Date(a);b.setDate(a.getDate()+6);const f=x=>x.toISOString().slice(0,10);return[f(a),f(b)]}
const sum=a=>a.reduce((s,t)=>s+t.valor,0);
const ic=e=>`<span class="ic">${e}</span>`;
const NC=['tx','tasks','list','calc','folders','docs','templates'];

let U=null,P=null,cid='casal',M=null,denied=false,authReady=false,loadingP=true,mode='login',tab='home',sub='lista',fold=null,prev=null,pending=false;
let S={tx:[],tasks:[],list:[],calc:[],folders:[],docs:[],templates:[],log:[]},unsubs=[];
const col=n=>collection(db,'casais',cid,n),ref=(n,id)=>doc(db,'casais',cid,n,id),metaRef=()=>doc(db,'casais',cid,'meta','main');
const stamp=()=>({by:P.name,uid:U.uid,at:serverTimestamp()});
const ed=()=>({edBy:P.name,edAt:serverTimestamp()});
const who=o=>`<small>${esc(o.by||'')} · ${tstr(o)}${o.edBy?' · editado por '+esc(o.edBy):''}</small>`;
const log=(t,b)=>{const r=ref('log',uid()),d={text:t,...stamp()};return b?b.set(r,d):setDoc(r,d).catch(()=>{})};
const bump=(b,n)=>b.update(metaRef(),{saldo:increment(n)});
const say=e=>{alert('Não foi possível salvar: '+(e&&e.message||e))};

/* ===== login / casal ===== */
const ERR={'auth/invalid-credential':'E-mail ou senha incorretos.','auth/wrong-password':'E-mail ou senha incorretos.','auth/user-not-found':'E-mail ou senha incorretos.','auth/email-already-in-use':'Este e-mail já tem conta. Use Entrar.','auth/weak-password':'Use uma senha com 6 ou mais caracteres.','auth/invalid-email':'E-mail inválido.','auth/too-many-requests':'Muitas tentativas. Aguarde um pouco.','auth/network-request-failed':'Sem internet.'};
const gerr=e=>{$('ge').textContent=ERR[e.code]||e.message};
function gate(){
  if(!authReady||(U&&loadingP))return`<div class="gt"><div><div class="logo">💜</div><p class="k">Carregando…</p></div></div>`;
  if(!U)return`<div class="gt"><div class="card"><div class="logo">💜</div><h1 style="margin:6px 0">Nosso Casal</h1><p class="k">Acesso restrito ao casal.</p><div class="seg" style="margin-top:12px"><button class="b ${mode==='login'?'':'s'}" onclick="authMode('login')">Entrar</button><button class="b ${mode==='new'?'':'s'}" onclick="authMode('new')">Criar conta</button></div><div class="f">${mode==='new'?'<input class="w" id="gn" placeholder="Seu nome">':''}<input class="w" id="ge1" type="email" placeholder="E-mail" autocomplete="email"><input class="w" id="gp" type="password" placeholder="Senha" autocomplete="${mode==='new'?'new-password':'current-password'}"><div class="err w" id="ge"></div><button class="b w" onclick="doAuth()">${mode==='new'?'Criar minha conta':'Entrar'}</button>${mode==='login'?'<button class="b s w" onclick="doReset()">Esqueci a senha</button>':''}</div></div></div>`;
  if(!U.emailVerified)return`<div class="gt"><div class="card"><div class="logo">✉️</div><h1 style="margin:6px 0">Confirme seu e-mail</h1><p class="k">Enviamos um link para <b>${esc(U.email)}</b>. Abra o e-mail, toque no link e volte aqui. Veja também a caixa de spam.</p><div class="f"><div class="err w" id="ge"></div><button class="b w" onclick="doVerified()">Já confirmei</button><button class="b s w" onclick="doResend()">Reenviar e-mail</button><button class="b s w" onclick="doOut()">Sair</button></div></div></div>`;
  if(denied)return`<div class="gt"><div class="card"><div class="logo">🔒</div><h1 style="margin:6px 0">Acesso não autorizado</h1><p class="k">O e-mail <b>${esc(U.email)}</b> não está na lista deste app.</p><div class="f"><button class="b w" onclick="doOut()">Sair</button></div></div></div>`;
  return''}
function authMode(m){mode=m;render()}
async function doAuth(){try{const e=val('ge1'),p=$('gp').value;if(mode==='new'){const n=val('gn');if(!n)return $('ge').textContent='Informe seu nome.';const c=await A.createUserWithEmailAndPassword(auth,e,p);await A.updateProfile(c.user,{displayName:n});await A.sendEmailVerification(c.user)}else await A.signInWithEmailAndPassword(auth,e,p)}catch(x){gerr(x)}}
async function doReset(){const e=val('ge1');if(!e)return $('ge').textContent='Digite seu e-mail acima.';try{await A.sendPasswordResetEmail(auth,e);$('ge').textContent='Enviamos um e-mail para redefinir a senha.'}catch(x){gerr(x)}}
const doOut=()=>A.signOut(auth);
const doVerified=()=>loadP();
async function doResend(){try{await A.sendEmailVerification(U);$('ge').textContent='E-mail reenviado.'}catch(e){gerr(e)}}
const onErr=()=>{denied=true;render()};
async function loadP(){loadingP=true;denied=false;render();
  try{await U.reload();U=auth.currentUser}catch(e){}
  if(!U.emailVerified){P=null;loadingP=false;render();return}
  unsubs.forEach(f=>f());unsubs=[];P={name:U.displayName||U.email.split('@')[0]};
  try{await U.getIdToken(true);const s=await getDoc(metaRef());if(!s.exists())await setDoc(metaRef(),{name:'Nosso Casal',saldo:0,verba:0,members:{}});await updateDoc(metaRef(),{['members.'+U.uid]:P.name})}
  catch(e){denied=true;loadingP=false;render();return}
  NC.forEach(n=>unsubs.push(onSnapshot(col(n),s=>{S[n]=s.docs.map(d=>({id:d.id,...d.data()}));sched()},onErr)));
  unsubs.push(onSnapshot(metaRef(),s=>{M=s.data();sched()},onErr));
  unsubs.push(onSnapshot(query(col('log'),orderBy('at','desc'),limit(8)),s=>{S.log=s.docs.map(d=>d.data());sched()},onErr));
  loadingP=false;render()}
A.onAuthStateChanged(auth,u=>{U=u;authReady=true;denied=false;unsubs.forEach(f=>f());unsubs=[];P=null;M=null;S={tx:[],tasks:[],list:[],calc:[],folders:[],docs:[],templates:[],log:[]};if(u)loadP();else{loadingP=false;render()}});

/* ===== tema / ajustes ===== */
const saveT=()=>{lset('casal_theme',JSON.stringify(T));render();openSet()};
const setPr=c=>{T.pr=c;saveT()},setMode=m=>{T.mode=m;saveT()};
function openSet(){
  const C=['#6d4aff','#2563eb','#0d9488','#16a34a','#f59e0b','#e11d48','#db2777','#334155'];
  $('sheet').innerHTML=`<div class="sh" onclick="if(event.target===this)closeSet()"><div class="card"><h2 style="margin-top:0">Acesso</h2><div class="k">Só os e-mails autorizados nas regras do banco entram. Membros: ${esc(Object.values(M&&M.members||{}).join(' e '))}</div><h2>Cor do app</h2><div class="sw">${C.map(c=>`<i style="background:${c}" class="${T.pr===c?'on':''}" onclick="setPr('${c}')"></i>`).join('')}</div><input type="color" value="${T.pr}" onchange="setPr(this.value)"><h2>Tema</h2><div class="seg">${[['auto','Auto'],['light','Claro'],['dark','Escuro']].map(m=>`<button class="b ${T.mode===m[0]?'':'s'}" onclick="setMode('${m[0]}')">${m[1]}</button>`).join('')}</div><h2>Conta (${esc(U.email)})</h2><div class="tabs"><button class="b s" onclick="renameCouple()">Nome do casal</button><button class="b s" onclick="doOut();closeSet()">Sair</button></div><button class="b full" onclick="closeSet()">Pronto</button></div></div>`}
const closeSet=()=>{$('sheet').innerHTML=''};
async function renameCouple(){const n=prompt('Nome do casal:',M.name);if(n&&n.trim()){await updateDoc(metaRef(),{name:n.trim()});closeSet()}}

/* ===== render ===== */
const busy=()=>[...document.querySelectorAll('#m input:not([type=checkbox]):not([type=date]):not([type=file]),#gate input')].some(i=>i.value)||document.activeElement&&document.activeElement.tagName==='INPUT'&&document.activeElement.type!=='checkbox'&&$('m').contains(document.activeElement);
function sched(){if(busy()){pending=true;return}requestAnimationFrame(render)}
document.addEventListener('focusout',()=>setTimeout(()=>{if(pending&&!busy()){pending=false;render()}},300));
const go=t=>{tab=t;render();scrollTo(0,0)},setSub=s=>{sub=s;render()},setFold=f=>{fold=f;render()};
function render(){
  applyTheme();const g=gate();$('gate').innerHTML=g;const ok=!g&&M;$('app').style.display=ok?'':'none';
  if(!g&&!M){$('gate').innerHTML='<div class="gt"><div><div class="logo">💜</div><p class="k">Carregando…</p></div></div>';return}
  if(!ok)return;
  $('ttl').textContent=M.name;$('sub').textContent='Olá, '+P.name;$('who').textContent='👤 '+P.name;
  const Tb=[['home','🏠','Home'],['fin','💶','Finanças'],['mer','🛒','Mercado'],['tar','✅','Tarefas'],['doc','📁','Docs']];
  $('nav').innerHTML=Tb.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('');
  $('m').innerHTML={home,fin,mer,tar,doc:doc_}[tab]()}

/* ===== HOME ===== */
const monthTx=()=>S.tx.filter(t=>(t.date||dstr(t)).slice(0,7)===mk());
function home(){
  const mt=monthTx(),mer=sum(mt.filter(t=>t.cat==='mercado')),fix=sum(mt.filter(t=>t.cat==='fixo'&&!t.pago)),ext=sum(mt.filter(t=>t.cat==='extra'));
  const pct=M.verba>0?Math.min(100,mer/M.verba*100):0,rest=M.verba-mer;
  const[a,b]=week(),wk=S.tasks.filter(t=>!t.done&&(!t.date||(t.date>=a&&t.date<=b))).sort((x,y)=>(x.date||'9').localeCompare(y.date||'9'));
  return`<div class="hero" onclick="setSaldo()"><div class="k2">Dinheiro disponível</div><div class="big">${eur(M.saldo)}</div><div class="k2">toque para editar</div></div>
  <div class="grid">
  <div class="card c" onclick="setVerba()">${ic('🛒')}<div class="k">Verba de mercado</div><div class="v" style="color:${rest<0?'var(--bad)':'inherit'}">${eur(rest)}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="k">gasto ${eur(mer)} de ${eur(M.verba)}</div></div>
  <div class="card c" onclick="go('fin')">${ic('📌')}<div class="k">A pagar no mês</div><div class="v">${eur(fix)}</div><div class="k">contas fixas pendentes</div></div>
  <div class="card c" onclick="go('fin')">${ic('🛍️')}<div class="k">Gastos variáveis</div><div class="v">${eur(ext)}</div><div class="k">fora de fixos e mercado</div></div>
  <div class="card c" onclick="go('tar')">${ic('✅')}<div class="k">Tarefas da semana</div><div class="v">${wk.length}</div><div class="k">pendente(s)</div></div></div>
  <h2>Na semana</h2><div class="card">${wk.length?wk.map(t=>`<div class="row"><input type="checkbox" onchange="togTask('${t.id}')"><div class="g">${esc(t.title)}<small>${t.date?fd(t.date):'sem data'} · ${esc(t.by)}</small></div></div>`).join(''):'<div class="empty">Nada pendente esta semana 🎉</div>'}</div>
  <h2>Atividade recente</h2><div class="card">${S.log.length?S.log.map(l=>`<div class="row"><div class="g">${esc(l.text)}<small>${esc(l.by)} · ${tstr(l)}</small></div></div>`).join(''):'<div class="empty">Sem atividade ainda</div>'}</div>`}
async function setSaldo(){const v=prompt('Quanto vocês têm em dinheiro agora?',M.saldo);if(v===null)return;const n=parseFloat(v.replace(',','.'))||0;try{await updateDoc(metaRef(),{saldo:n});log('Ajustou o saldo para '+eur(n))}catch(e){say(e)}}
async function setVerba(){const v=prompt('Verba de mercado do mês:',M.verba);if(v===null)return;const n=parseFloat(v.replace(',','.'))||0;try{await updateDoc(metaRef(),{verba:n});log('Definiu a verba de mercado em '+eur(n))}catch(e){say(e)}}

/* ===== FINANÇAS ===== */
const CAT={fixo:'📌 Fixo',mercado:'🛒 Mercado',extra:'🛍️ Extra'},counted=t=>t.cat!=='fixo'||t.pago;
let fsub='fixo';
const setFin=k=>{fsub=k;render()};
const FL={fixo:['📌','Contas fixas'],extra:['🛍️','Gastos variáveis'],mercado:['🛒','Mercado']};
const FE={fixo:'Nenhuma conta fixa neste mês',extra:'Nenhum gasto variável neste mês',mercado:'Nenhuma compra de mercado neste mês'};
function fin(){
  const all=monthTx().sort((a,b)=>(b.date||'').localeCompare(a.date||'')),by=k=>all.filter(t=>t.cat===k),l=by(fsub),T=sum(l);
  const tabs=`<div class="seg">${Object.keys(FL).map(k=>`<button class="b ${fsub===k?'':'s'}" style="font-size:12px;line-height:1.25;padding:6px 2px" onclick="setFin('${k}')">${FL[k][0]} ${FL[k][1]}<br><span style="font-weight:500;opacity:.8">${eur(sum(by(k)))}</span></button>`).join('')}</div>`;
  let sm;
  if(fsub==='fixo'){const P_=sum(l.filter(t=>t.pago));sm=`<div class="k">Contas fixas do mês</div><div class="v">${eur(T)}</div><div class="bar"><i style="width:${T?P_/T*100:0}%"></i></div><div class="k">pago ${eur(P_)} · falta ${eur(T-P_)}</div>`}
  else if(fsub==='mercado'){const r=M.verba-T;sm=`<div class="k">Gasto em mercado no mês</div><div class="v">${eur(T)}</div>${M.verba?`<div class="bar"><i style="width:${Math.min(100,T/M.verba*100)}%"></i></div><div class="k">verba ${eur(M.verba)} · ${r<0?'passou '+eur(-r):'restam '+eur(r)}</div>`:'<div class="k">Defina a verba tocando no card de mercado na Home</div>'}`}
  else sm=`<div class="k">Gastos variáveis do mês (sem planejamento)</div><div class="v">${eur(T)}</div><div class="k">${l.length} lançamento(s)</div>`;
  return tabs+`<div class="card">${sm}</div>
  <h2>Novo lançamento</h2><div class="card"><div class="f"><input class="w" id="fd" placeholder="Descrição (ex: ${fsub==='fixo'?'Aluguel':fsub==='mercado'?'Compra da semana':'Farmácia'})"><input id="fv" inputmode="decimal" placeholder="Valor"><select id="fc">${['fixo','extra','mercado'].map(k=>`<option value="${k}" ${k===fsub?'selected':''}>${CAT[k]}</option>`).join('')}</select><input type="date" id="fdt" value="${today()}"><select id="fp">${Object.values(M.members||{}).map(n=>`<option ${n===P.name?'selected':''}>${esc(n)}</option>`).join('')}</select><button class="b w" onclick="addTx()">Lançar</button></div><div class="k" style="margin-top:8px">${fsub==='fixo'?'Conta fixa desconta do saldo quando você marcar como paga.':'Desconta do saldo na hora.'} Cada lançamento registra quem fez.</div></div>
  <h2>${FL[fsub][1]} do mês</h2><div class="card">${l.length?l.map(t=>`<div class="row">${t.cat==='fixo'?`<input type="checkbox" ${t.pago?'checked':''} onchange="payTx('${t.id}')">`:''}<div class="g"><span class="${t.pago?'done':''}">${esc(t.desc)}</span><small>${fd(t.date||'')} · pagador: ${esc(t.payer||t.by)}</small>${who(t)}</div><b>${eur(t.valor)}</b><button class="x e" onclick="editTx('${t.id}')">✎</button><button class="x" onclick="delTx('${t.id}')">×</button></div>`).join(''):`<div class="empty">${FE[fsub]}</div>`}</div>`}
async function addTx(){const d=val('fd'),v=num('fv');if(!d||!v)return alert('Preencha descrição e valor');const t={desc:d,valor:v,cat:val('fc'),pago:false,date:val('fdt')||today(),payer:val('fp'),...stamp()};
  try{const b=writeBatch(db);b.set(ref('tx',uid()),t);if(counted(t))bump(b,-v);log('Lançou '+d+' ('+eur(v)+', '+CAT[t.cat]+')',b);await b.commit()}catch(e){say(e)}}
async function payTx(id){const t=S.tx.find(x=>x.id===id);try{const b=writeBatch(db);b.update(ref('tx',id),{pago:!t.pago,...ed()});bump(b,t.pago?t.valor:-t.valor);log((t.pago?'Desmarcou o pagamento de ':'Pagou ')+t.desc,b);await b.commit()}catch(e){say(e)}}
async function delTx(id){const t=S.tx.find(x=>x.id===id);if(!confirm('Apagar '+t.desc+'?'))return;try{const b=writeBatch(db);b.delete(ref('tx',id));if(counted(t))bump(b,t.valor);log('Apagou '+t.desc,b);await b.commit()}catch(e){say(e)}}
async function editTx(id){const t=S.tx.find(x=>x.id===id);const d=prompt('Descrição:',t.desc);if(d===null)return;const v=prompt('Valor:',t.valor);if(v===null)return;const n=parseFloat(v.replace(',','.'))||t.valor;
  try{const b=writeBatch(db);b.update(ref('tx',id),{desc:d.trim()||t.desc,valor:n,...ed()});if(counted(t))bump(b,t.valor-n);log('Editou '+t.desc,b);await b.commit()}catch(e){say(e)}}

/* ===== MERCADO ===== */
function mer(){
  const tabs=`<div class="seg"><button class="b ${sub==='lista'?'':'s'}" onclick="setSub('lista')">📝 Lista</button><button class="b ${sub==='calc'?'':'s'}" onclick="setSub('calc')">🧮 Calculadora</button></div>`;
  if(sub==='lista')return tabs+`<div class="card"><div class="f"><input class="w" id="ln" placeholder="Item (ex: Arroz)"><input id="lq" inputmode="decimal" placeholder="Quantidade (1)"><button class="b" onclick="addL()">Adicionar</button></div></div><div class="card" style="margin-top:12px">${S.list.length?S.list.sort((a,b)=>dt(a)-dt(b)).map(i=>`<div class="row"><input type="checkbox" ${i.done?'checked':''} onchange="togL('${i.id}')"><div class="g"><span class="${i.done?'done':''}">${esc(i.name)}</span>${who(i)}</div><button class="q" onclick="qL('${i.id}',-1)">−</button><b>${i.qtd||1}</b><button class="q" onclick="qL('${i.id}',1)">+</button><button class="x" onclick="delL('${i.id}')">×</button></div>`).join(''):'<div class="empty">Lista vazia</div>'}</div>${S.list.length?'<p><button class="b s full" onclick="toCalc()">Enviar itens pendentes para a calculadora →</button></p><div class="tabs"><button class="b s" onclick="saveTpl()">💾 Salvar esta lista</button><button class="b s" onclick="clearL()">🧹 Limpar lista</button></div>':''}${S.templates.length?`<h2>Listas salvas</h2><div class="card">${S.templates.map(t=>`<div class="row"><div class="g">📋 ${esc(t.name)}<small>${t.items.length} itens · ${esc(t.by||'')}</small></div><button class="b s" onclick="useTpl('${t.id}')">Usar</button><button class="x" onclick="delTpl('${t.id}')">×</button></div>`).join('')}</div>`:''}`;
  const tot=S.calc.reduce((s,i)=>s+i.qtd*i.preco,0),cart=S.calc.filter(i=>i.cart).reduce((s,i)=>s+i.qtd*i.preco,0);
  const sticky=`<div style="position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0"><div class="card"><div class="k">🛒 No carrinho</div><div class="v">${eur(cart)}</div><div class="bar"><i style="width:${tot?Math.min(100,cart/tot*100):0}%"></i></div><div class="k">planejado ${eur(tot)}${M.verba?' · verba restante '+eur(M.verba-sum(monthTx().filter(t=>t.cat==='mercado'))):''}</div></div></div>`;
  return tabs+sticky+`<div class="card"><div class="f"><input class="w" id="cn" placeholder="Produto"><input id="cq" inputmode="decimal" placeholder="Quantidade (1)"><input id="cp" inputmode="decimal" placeholder="Valor unitário"><button class="b w" onclick="addC()">Adicionar</button></div></div><div class="card" style="margin-top:12px">${S.calc.length?S.calc.sort((a,b)=>dt(a)-dt(b)).map(i=>`<div class="row"><input type="checkbox" ${i.cart?'checked':''} onchange="cartC('${i.id}')"><div class="g"><span class="${i.cart?'done':''}">${esc(i.name)}</span><small>${eur(i.preco)} cada · ${esc(i.by)}</small></div><button class="q" onclick="qC('${i.id}',-1)">−</button><b>${i.qtd}</b><button class="q" onclick="qC('${i.id}',1)">+</button><b style="min-width:68px;text-align:right">${eur(i.qtd*i.preco)}</b><button class="x" onclick="delC('${i.id}')">×</button></div>`).join(''):'<div class="empty">Nada na calculadora</div>'}</div><div class="tot">Planejado: ${eur(tot)}</div>${cart?'<button class="b full" onclick="buy()">Finalizar compra do carrinho e lançar em Finanças</button>':'<div class="empty">Marque os itens que já estão no carrinho</div>'}`}
async function addL(){const n=val('ln'),q=num('lq')||1;if(!n)return;try{await setDoc(ref('list',uid()),{name:n,qtd:q,done:false,...stamp()});log('Adicionou à lista: '+q+'× '+n)}catch(e){say(e)}}
const togL=id=>updateDoc(ref('list',id),{done:!S.list.find(x=>x.id===id).done,...ed()}).catch(say);
const delL=id=>F.deleteDoc(ref('list',id)).catch(say);
const qL=(id,d)=>{const i=S.list.find(x=>x.id===id),n=(i.qtd||1)+d;if(n<1)return;updateDoc(ref('list',id),{qtd:n,...ed()}).catch(say)};
async function saveTpl(){if(!S.list.length)return;const n=prompt('Nome da lista (ex: Compra do mês):');if(!n||!n.trim())return;const ex=S.templates.find(t=>t.name.toLowerCase()===n.trim().toLowerCase());if(ex&&!confirm('Já existe uma lista com esse nome. Substituir?'))return;
  try{await setDoc(ref('templates',ex?ex.id:uid()),{name:n.trim(),items:S.list.map(i=>({name:i.name,qtd:i.qtd||1})),...stamp()});log('Salvou a lista de mercado: '+n.trim())}catch(e){say(e)}}
async function useTpl(id){const t=S.templates.find(x=>x.id===id),have=new Set(S.list.map(i=>i.name.toLowerCase())),add=t.items.filter(i=>!have.has(i.name.toLowerCase()));if(!add.length)return alert('Todos os itens já estão na lista.');
  try{const b=writeBatch(db);add.forEach(i=>b.set(ref('list',uid()),{name:i.name,qtd:i.qtd||1,done:false,...stamp()}));log('Usou a lista salva '+t.name+' ('+add.length+' itens)',b);await b.commit()}catch(e){say(e)}}
const delTpl=id=>{const t=S.templates.find(x=>x.id===id);if(confirm('Apagar a lista salva '+t.name+'?'))F.deleteDoc(ref('templates',id)).catch(say)};
async function clearL(){if(!confirm('Limpar todos os itens da lista? As listas salvas continuam guardadas.'))return;try{const b=writeBatch(db);S.list.forEach(i=>b.delete(ref('list',i.id)));log('Limpou a lista de mercado',b);await b.commit()}catch(e){say(e)}}
async function toCalc(){const p=S.list.filter(i=>!i.done);try{const b=writeBatch(db);p.forEach(i=>b.set(ref('calc',uid()),{name:i.name,qtd:i.qtd||1,preco:0,cart:false,...stamp()}));log('Enviou '+p.length+' item(ns) da lista para a calculadora',b);await b.commit();setSub('calc')}catch(e){say(e)}}
async function addC(){const n=val('cn');if(!n)return;try{await setDoc(ref('calc',uid()),{name:n,qtd:num('cq')||1,preco:num('cp'),cart:false,...stamp()})}catch(e){say(e)}}
const delC=id=>F.deleteDoc(ref('calc',id)).catch(say);
const cartC=id=>updateDoc(ref('calc',id),{cart:!S.calc.find(x=>x.id===id).cart,...ed()}).catch(say);
const qC=(id,d)=>{const i=S.calc.find(x=>x.id===id);if(i.qtd+d<1)return;updateDoc(ref('calc',id),{qtd:increment(d),...ed()}).catch(say)};
async function buy(){const it=S.calc.filter(i=>i.cart),t=it.reduce((s,i)=>s+i.qtd*i.preco,0);if(!t||!confirm('Lançar '+eur(t)+' como gasto de mercado?'))return;
  try{const b=writeBatch(db);b.set(ref('tx',uid()),{desc:'Compra de mercado',valor:t,cat:'mercado',pago:false,date:today(),payer:P.name,...stamp()});it.forEach(i=>b.delete(ref('calc',i.id)));bump(b,-t);log('Finalizou compra de mercado de '+eur(t),b);await b.commit()}catch(e){say(e)}}

/* ===== TAREFAS ===== */
function tar(){
  const l=[...S.tasks].sort((a,b)=>(a.done-b.done)||(a.date||'9').localeCompare(b.date||'9'));
  return`<div class="card"><div class="f"><input class="w" id="tt" placeholder="O que precisa ser feito?"><input type="date" id="td"><button class="b" onclick="addT()">Adicionar</button></div></div><h2>Todas</h2><div class="card">${l.length?l.map(t=>`<div class="row"><input type="checkbox" ${t.done?'checked':''} onchange="togTask('${t.id}')"><div class="g"><span class="${t.done?'done':''}">${esc(t.title)}</span><small>${t.date?fd(t.date):'sem data'} · ${esc(t.by)}${t.edBy?' · atualizado por '+esc(t.edBy):''}</small></div><button class="x" onclick="delT('${t.id}')">×</button></div>`).join(''):'<div class="empty">Sem tarefas</div>'}</div>`}
async function addT(){const n=val('tt');if(!n)return;try{await setDoc(ref('tasks',uid()),{title:n,date:val('td'),done:false,...stamp()});log('Criou a tarefa: '+n)}catch(e){say(e)}}
async function togTask(id){const t=S.tasks.find(x=>x.id===id);try{await updateDoc(ref('tasks',id),{done:!t.done,...ed()});log((t.done?'Reabriu':'Concluiu')+' a tarefa: '+t.title)}catch(e){say(e)}}
const delT=id=>F.deleteDoc(ref('tasks',id)).catch(say);

/* ===== DOCUMENTOS ===== */
const dtag=v=>{const n=days(v),c=n<0?'late':n<=30?'soon':'ok';return`<span class="tag ${c}">${n<0?'vencido há '+(-n)+'d':n===0?'vence hoje':n+' dias'}</span>`};
const thumb=d=>d.th?`<img src="${esc(d.th)}" alt="" style="width:42px;height:42px;object-fit:cover;border-radius:10px">`:'';
const docRow=d=>{const f=S.folders.find(x=>x.id===d.folder);return`<div class="row" onclick="openD('${d.id}')">${thumb(d)}<div class="g">📄 ${esc(d.name)}<small>${f?esc(f.name)+' · ':''}vence ${fd(d.venc)}</small></div>${dtag(d.venc)}</div>`};
function doc_(){
  const fo=S.folders.find(f=>f.id===fold);
  if(!fo){const dc=S.docs.filter(d=>d.venc&&days(d.venc)<=30).sort((a,b)=>a.venc.localeCompare(b.venc));
    return`<h2 style="margin-top:4px">Documentos a vencer</h2><div class="card">${dc.length?dc.map(docRow).join(''):'<div class="empty">Nenhum documento vence nos próximos 30 dias</div>'}</div><h2>Pastas</h2>${S.folders.length?`<div class="grid">${S.folders.map(f=>`<div class="card c" onclick="setFold('${f.id}')">${ic('📁')}<div><b>${esc(f.name)}</b></div><div class="k">${S.docs.filter(d=>d.folder===f.id).length} documento(s)</div></div>`).join('')}</div>`:'<div class="card empty">Nenhuma pasta ainda. Crie a primeira para guardar documentos.</div>'}<p><button class="b full" onclick="addF()">＋ Nova pasta</button></p>`}
  const l=S.docs.filter(d=>d.folder===fold);
  return`<div class="tabs"><button class="b s" onclick="setFold(null)">← Pastas</button><button class="b s" onclick="renF()">Renomear</button><button class="b s" onclick="delF()">Excluir pasta</button></div><h2 style="margin-top:4px">📁 ${esc(fo.name)}</h2><div class="card"><div class="f"><input class="w" id="dn" placeholder="Nome do documento (ex: Passaporte)"><input type="date" id="dv" title="Vencimento"><input type="file" id="df"><button class="b w" id="dbt" onclick="addD()">Carregar documento</button></div><div class="k" style="margin-top:8px">Vencimento e arquivo são opcionais. Fotos são reduzidas automaticamente; PDFs até 680 KB.</div></div><div class="card" style="margin-top:12px">${l.length?l.map(d=>`<div class="row">${thumb(d)}<div class="g" onclick="openD('${d.id}')">📄 ${esc(d.name)}<small>${d.venc?'vence '+fd(d.venc)+' · ':''}${esc(d.by)} · ${tstr(d)}</small></div>${d.venc?dtag(d.venc):''}<button class="x" onclick="delD('${d.id}')">×</button></div>`).join(''):'<div class="empty">Pasta vazia</div>'}</div>`}
async function addF(){const n=prompt('Nome da pasta (pessoa, casa, pet...):');if(n&&n.trim()){try{await setDoc(ref('folders',uid()),{name:n.trim(),...stamp()});log('Criou a pasta '+n.trim())}catch(e){say(e)}}}
async function renF(){const f=S.folders.find(x=>x.id===fold),n=prompt('Novo nome:',f.name);if(n&&n.trim())updateDoc(ref('folders',fold),{name:n.trim(),...ed()}).catch(say)}
async function delF(){const ds=S.docs.filter(d=>d.folder===fold);if(!confirm('Excluir esta pasta'+(ds.length?' e seus '+ds.length+' documento(s)':'')+'?'))return;try{const b=writeBatch(db);ds.forEach(d=>{b.delete(ref('docs',d.id));b.delete(ref('files',d.id))});b.delete(ref('folders',fold));await b.commit();fold=null;render()}catch(e){say(e)}}
const rd=f=>new Promise((r,j)=>{const x=new FileReader();x.onload=()=>r(x.result);x.onerror=j;x.readAsDataURL(f)});
function shrink(url,max,q){return new Promise(res=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.onerror=()=>res(null);im.src=url})}
async function addD(){const n=val('dn'),f=$('df').files[0];if(!n)return alert('Dê um nome ao documento');$('dbt').textContent='Enviando…';
  const m={folder:fold,name:n,venc:val('dv'),...stamp()};let data=null;
  try{if(f){let u=await rd(f);if(f.type.startsWith('image/')){let mx=1600,q=.8;u=await shrink(u,mx,q);while(u&&u.length>900000&&mx>500){mx-=250;u=await shrink(u,mx,q-.1)}if(!u)throw{message:'Imagem inválida.'};m.th=await shrink(u,96,.6);m.type='image/jpeg'}else{if(f.size>680000)throw{message:'Arquivo acima de 680 KB. Reduza ou envie uma foto.'};m.type=f.type}m.fname=f.name;data=u}
    const id=uid(),b=writeBatch(db);b.set(ref('docs',id),m);if(data)b.set(ref('files',id),{data,...stamp()});log('Adicionou o documento '+n,b);await b.commit()}
  catch(e){$('dbt').textContent='Carregar documento';return alert(e.message||'Não consegui enviar.')}}
async function delD(id){const d=S.docs.find(x=>x.id===id);if(!confirm('Apagar '+d.name+'?'))return;try{const b=writeBatch(db);b.delete(ref('docs',id));b.delete(ref('files',id));log('Apagou o documento '+d.name,b);await b.commit()}catch(e){say(e)}}
async function openD(id){const d=S.docs.find(x=>x.id===id);let data=null;try{const s=await getDoc(ref('files',id));data=s.exists()?s.data().data:null}catch(e){}
  prev=`<div class="sh" onclick="if(event.target===this)closePrev()"><div class="card"><h2 style="margin-top:0">${esc(d.name)}</h2><div class="k">${d.venc?'Vence '+fd(d.venc)+' · ':''}${esc(d.by)}</div>${data?((d.type||'').startsWith('image')?`<img src="${data}" alt="" style="width:100%;border-radius:14px;margin:12px 0">`:'')+`<a class="b s full" style="margin:8px 0" href="${data}" download="${esc(d.fname||d.name)}">Baixar arquivo</a>`:'<div class="empty">Sem arquivo anexado</div>'}<button class="b full" onclick="closePrev()">Fechar</button></div></div>`;$('sheet').innerHTML=prev}
const closePrev=()=>{$('sheet').innerHTML=''};

Object.assign(window,{setFin,qL,saveTpl,useTpl,delTpl,clearL,authMode,doAuth,doReset,doOut,doVerified,doResend,openSet,closeSet,setPr,setMode,renameCouple,go,setSub,setFold,setSaldo,setVerba,addTx,payTx,delTx,editTx,addL,togL,delL,toCalc,addC,delC,cartC,qC,buy,addT,togTask,delT,addF,renF,delF,addD,delD,openD,closePrev});
render();
}
</script>
